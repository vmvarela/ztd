name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is covered by build-all's cross-compile job; the corpus
        # harness runs the binary it tests, so it needs a POSIX runner.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Format
        run: zig fmt --check src test build.zig

      - name: Test
        run: zig build test

      - name: Corpus
        run: zig build corpus

      - name: Integration
        run: zig build integration

      - name: Smoke
        run: ./zig-out/bin/ztd version
