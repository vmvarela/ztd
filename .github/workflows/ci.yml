name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Format
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt reported unformatted files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Integration
        run: go test ./test/integration -count=1

      - name: Build
        run: go build -o ztd ./cmd/ztd

      - name: Smoke
        shell: bash
        run: go run ./cmd/ztd version
