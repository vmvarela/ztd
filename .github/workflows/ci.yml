name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is covered by build-all's cross-compile job; the corpus
        # harness runs the binary it tests, so it needs a POSIX runner.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The conformance corpus is a Go harness: it drives the built binary as
      # a subprocess and compares its JSON against the recorded goldens.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Format
        run: zig fmt --check src build.zig

      - name: Test
        run: zig build test

      - name: Vet harness
        run: go vet ./test/...

      - name: Corpus
        run: |
          zig build --release=fast
          ZTD_BIN=./zig-out/bin/ztd go test ./test/corpus -count=1

      - name: Smoke
        run: ./zig-out/bin/ztd version
