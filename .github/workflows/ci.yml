name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Format
        run: zig fmt --check build.zig src
      - name: Test
        run: zig build test
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Integration
        shell: bash
        run: bash test/integration.sh
      - name: Smoke
        shell: bash
        run: |
          if [ -f zig-out/bin/ztd.exe ]; then
            ./zig-out/bin/ztd.exe version
          else
            ./zig-out/bin/ztd version
          fi
