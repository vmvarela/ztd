name: Build all targets

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-compile:
    name: Cross-compile ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 12 release targets, with the names install.sh, install.ps1 and
          # the package catalog expect.
          - { target: x86_64-linux-musl, asset: ztd-x86_64-linux }
          - { target: aarch64-linux-musl, asset: ztd-aarch64-linux }
          - { target: arm-linux-musleabihf, asset: ztd-armv7-linux }
          - { target: riscv64-linux-musl, asset: ztd-riscv64-linux }
          - { target: x86-linux-musl, asset: ztd-x86-linux }
          - { target: x86_64-macos, asset: ztd-x86_64-macos }
          - { target: aarch64-macos, asset: ztd-aarch64-macos }
          - { target: x86_64-windows-gnu, asset: ztd-x86_64-windows.exe }
          - { target: aarch64-windows-gnu, asset: ztd-aarch64-windows.exe }
          - { target: x86-windows-gnu, asset: ztd-x86-windows.exe }
          - { target: x86_64-freebsd, asset: ztd-x86_64-freebsd }
          - { target: aarch64-freebsd, asset: ztd-aarch64-freebsd }

    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Compile only (no run) — catches cross-target breakage in PRs before
      # it surfaces in release builds.
      - name: Build
        run: |
          zig build --release=fast -Dtarget=${{ matrix.target }} --prefix dist
          if [ -f dist/bin/ztd ]; then
            mv dist/bin/ztd "dist/${{ matrix.asset }}"
          else
            mv dist/bin/ztd.exe "dist/${{ matrix.asset }}"
          fi

  # Not a release target: compiled here so a POSIX portability break shows up
  # in PRs, and never fails a PR.
  netbsd:
    name: Cross-compile netbsd (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: |
          mkdir -p dist
          zig build --release=fast -Dtarget=x86_64-netbsd --prefix dist
          mv dist/bin/ztd dist/ztd-x86_64-netbsd
