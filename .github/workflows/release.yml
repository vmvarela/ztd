name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, asset: ztd-x86_64-linux }
          - { goos: linux, goarch: arm64, asset: ztd-aarch64-linux }
          - { goos: linux, goarch: arm, goarm: "7", asset: ztd-armv7-linux }
          - { goos: linux, goarch: 386, asset: ztd-x86-linux }
          - { goos: darwin, goarch: amd64, asset: ztd-x86_64-macos }
          - { goos: darwin, goarch: arm64, asset: ztd-aarch64-macos }
          - { goos: windows, goarch: amd64, asset: ztd-x86_64-windows.exe }
          - { goos: windows, goarch: arm64, asset: ztd-aarch64-windows.exe }
          - { goos: windows, goarch: 386, asset: ztd-x86-windows.exe }
          - { goos: freebsd, goarch: amd64, asset: ztd-x86_64-freebsd }
          - { goos: freebsd, goarch: arm64, asset: ztd-aarch64-freebsd }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X ztd/internal/cli.Version=$VERSION" -o "dist/${{ matrix.asset }}" ./cmd/ztd

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/
          if-no-files-found: error

  # Best effort: include ztd-riscv64-linux only when the cross-build works.
  build-riscv64:
    name: Build ztd-riscv64-linux (best effort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build
        id: riscv
        continue-on-error: true
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: riscv64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X ztd/internal/cli.Version=$VERSION" -o dist/ztd-riscv64-linux ./cmd/ztd

      - name: Report omission
        if: steps.riscv.outcome != 'success'
        run: echo "::notice::riscv64 cross-build failed; ztd-riscv64-linux is omitted from this release"

      - uses: actions/upload-artifact@v4
        if: steps.riscv.outcome == 'success'
        with:
          name: ztd-riscv64-linux
          path: dist/
          if-no-files-found: error

  release:
    name: Stage draft release
    needs: [build, build-riscv64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate sha256sums.txt
        run: |
          cd artifacts
          for f in *; do
            [ "$f" = sha256sums.txt ] || sha256sum "$f"
          done | tee sha256sums.txt

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=true --repo "$REPO"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --draft \
              --repo "$REPO"
          fi
          gh release upload "$TAG" artifacts/* --repo "$REPO" --clobber
